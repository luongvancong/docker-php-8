name: Build php8.2-apache

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Php8.2-Apache.Dockerfile
      - .github/workflows/build-php8.2-apache.yml
      - scripts/smoke-test.sh

concurrency:
  group: build-php8.2-apache
  cancel-in-progress: false

env:
  IMAGE: justinluong/php8.2
  PHP_VERSION: 8.2.35

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build 1: chỉ amd64, nạp vào docker local để smoke test. Chưa push gì.
      - name: Build (amd64, test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Php8.2-Apache.Dockerfile
          platforms: linux/amd64
          load: true
          tags: php82:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-test.sh php82:test "$PHP_VERSION"

      - name: Image size
        run: |
          size="$(docker image inspect php82:test --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')"
          echo "### php82 (linux/amd64) size: $size" >> "$GITHUB_STEP_SUMMARY"

      # Build 2: chỉ chạy khi smoke test đã qua. Dùng lại cache lớp amd64.
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Php8.2-Apache.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.PHP_VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
