name: Build php8.2-apache

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - Php8.2-Apache.Dockerfile
      - .github/workflows/build-php8.2-apache.yml
      - scripts/smoke-test.sh

concurrency:
  group: build-php8.2-apache
  cancel-in-progress: false

env:
  IMAGE: justinluong/php8.2
  PHP_VERSION: 8.2.35

jobs:
  # Mỗi kiến trúc build trên runner native của nó (arm64 qua QEMU mất >35 phút).
  # Smoke test qua rồi mới push, push theo digest, job merge gắn tag sau.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Prepare
        run: echo "PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Php8.2-Apache.Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: php82:test
          cache-from: type=gha,scope=${{ env.PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PAIR }}

      - name: Smoke test
        run: scripts/smoke-test.sh php82:test "$PHP_VERSION"

      - name: Image size
        run: |
          size="$(docker image inspect php82:test --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')"
          echo "### php82 (${{ matrix.platform }}) size: $size" >> "$GITHUB_STEP_SUMMARY"

      # Dùng lại cache của bước trên nên gần như không build lại.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Php8.2-Apache.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest and tag
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$PHP_VERSION" -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$PHP_VERSION"
